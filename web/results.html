<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainclip reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Brainclip: the reel as an EEG printout. Paper, two pens, one highlighter. */
  :root {
    --paper: #edf1ea;
    --paper-deep: #e2e9df;
    --grid: #cddccf;
    --grid-major: #aac6b0;
    --ink: #16233b;
    --ink-soft: #55627a;
    --red: #d7262e;       /* Hype pen */
    --blue: #1f4fd1;      /* Locked in pen */
    --marker: #f3e33d;    /* highlighter */
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font-family: Archivo, system-ui, sans-serif; font-size: 17px; line-height: 1.5;
         font-variation-settings: "wdth" 100; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 32px 40px 56px; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
  .mark { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; font-stretch: 125%; letter-spacing: -0.02em; }
  .mark svg { width: 44px; height: 22px; }
  .actions { display: flex; gap: 10px; }
  button, .btn { font: inherit; font-weight: 700; font-size: 17px; padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 border: 2px solid var(--ink); text-decoration: none; display: inline-block; }
  .primary { background: var(--ink); color: var(--paper); }
  .ghost { background: transparent; color: var(--ink); }
  button:hover, .btn:hover { transform: translateY(-1px); }
  button:focus-visible, .btn:focus-visible, .row:focus-visible, canvas:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .title { margin: 36px 0 28px; }
  h1 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(48px, 6.4vw, 104px); line-height: 0.92; letter-spacing: -0.035em; }
  .lede { margin: 14px 0 0; font-size: 20px; color: var(--ink-soft); max-width: 60ch; }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
  @media (max-width: 980px) { .stage { grid-template-columns: 1fr; } }

  .screen { position: relative; aspect-ratio: 16 / 9; background: #0d1220; border: 2px solid var(--ink); }
  .screen video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .empty { height: 100%; display: grid; place-items: center; color: #c9d1e0; text-align: center; padding: 24px; }
  .note { position: absolute; top: -18px; left: 18px; font-family: Caveat, cursive; font-weight: 700; font-size: 34px; line-height: 1;
          padding: 2px 12px 4px; transform: rotate(-3deg); background: var(--marker); color: var(--ink); }

  .replay { margin-top: 18px; border: 2px solid var(--ink); background: var(--paper); }
  .replay-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 16px 0; flex-wrap: wrap; }
  .replay-head h2 { margin: 0; font-size: 18px; font-weight: 800; font-stretch: 112%; }
  .replay-head p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .replay-head b { color: var(--ink); font-stretch: 75%; font-size: 22px; }
  .strip { position: relative; height: 170px; }
  .tall { height: 270px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .log h2 { margin: 0 0 6px; font-size: 18px; font-weight: 800; font-stretch: 112%; }
  .log p.hint { margin: 0 0 12px; color: var(--ink-soft); font-size: 15px; }
  .rows { border-top: 2px solid var(--ink); }
  .row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 8px 12px 4px;
         border-bottom: 1px solid var(--grid-major); cursor: pointer; position: relative; }
  .row:hover { background: var(--paper-deep); }
  .row.on { background: linear-gradient(transparent 12%, rgba(243,227,61,.75) 12%, rgba(243,227,61,.75) 88%, transparent 88%); }
  .row .n { font-weight: 900; font-stretch: 62%; font-size: 40px; line-height: 1; text-align: center; }
  .row .k { font-weight: 800; font-size: 19px; }
  .row .k.Hype { color: var(--red); }
  .row .k.Locked { color: var(--blue); }
  .row .when { color: var(--ink-soft); font-size: 15px;
