<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brainclip overlay</title>
<!--
  Streamer overlay for OBS.
  OBS > Sources > + > Browser
    URL:    http://localhost:8765/overlay.html   (while run_session.py is running)
    Width:  500   Height: 230
  Everything outside the little chart-paper card is transparent.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #edf1ea; --ink: #16233b; --ink-soft: #55627a; --red: #d7262e; --blue: #1f4fd1; --marker: #f3e33d; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: Archivo, system-ui, sans-serif; color: var(--ink); padding: 20px 26px 34px; }
  .card { position: relative; width: 420px; background: var(--paper); border: 3px solid var(--ink);
          box-shadow: 6px 6px 0 rgba(22,35,59,.85); transform: rotate(-1.2deg); }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px 4px; border-bottom: 1px solid #aac6b0; }
  .mark { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; font-stretch: 125%; }
  .mark svg { width: 30px; height: 15px; }
  .vals { display: flex; gap: 14px; font-weight: 900; font-stretch: 62%; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
  .vals .h { color: var(--red); }
  .vals .f { color: var(--blue); }
  .vals .w { font-family: Caveat, cursive; font-stretch: normal; font-weight: 700; color: var(--ink-soft); font-size: 22px; }
  canvas { display: block; width: 414px; height: 110px; }
  .note { position: absolute; right: -8px; bottom: -20px; font-family: Caveat, cursive; font-weight: 700; font-size: 30px; line-height: 1;
          padding: 2px 12px 4px; background: var(--marker); transform: rotate(4deg) scale(.6); opacity: 0;
          transition: opacity .2s, transform .25s; }
  .note.show { opacity: 1; transform: rotate(4deg) scale(1); }
  @media (prefers-reduced-motion: reduce) { .note { transition: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="mark"><svg viewBox="0 0 44 22" aria-hidden="true"><path d="M1 13h9l3-9 5 16 4-12 3 5h18" fill="none" stroke="#d7262e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>brainclip</div>
    <div class="vals" id="vals"><span class="w">warming up</span></div>
  </div>
  <canvas id="c"></canvas>
  <div class="note" id="note"></div>
</div
