<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainclip live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* The live screen the room watches: a plotter drawing the player's brain on chart paper. */
  :root {
    --paper: #edf1ea; --grid: #cddccf; --grid-major: #aac6b0;
    --ink: #16233b; --ink-soft: #55627a; --red: #d7262e; --blue: #1f4fd1; --marker: #f3e33d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Archivo, system-ui, sans-serif;
         display: flex; flex-direction: column; padding: 28px 40px 32px; gap: 18px; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .mark { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 30px; font-stretch: 125%; letter-spacing: -0.02em; }
  .mark svg { width: 58px; height: 28px; }
  .clock { display: flex; align-items: center; gap: 18px; }
  .status { font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ink-soft); }
  .status.rec .dot { background: var(--red); animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .timer { font-weight: 900; font-stretch: 62%; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }

  .readouts { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--grid-major); }
  .readout { padding: 12px 20px 14px; border-left: 1px solid var(--grid-major); }
  .readout:first-child { border-left: 0; padding-left: 0; }
  .readout .name { font-size: 19px; font-weight: 700; }
  .readout .val { font-weight: 900; font-stretch: 62%; font-size: 92px; line-height: 0.95; font-variant-numeric: tabular-nums; }
  .readout.hype .val { color: var(--red); }
  .readout.focus .val { color: var(--blue); }
  .readout .sub { font-size: 16px; color: var(--ink-soft); }
  .readout.spike .val { background: linear-gradient(transparent 18%, rgba(243,227,61,.85) 18%, rgba(243,227,61,.85) 86%, transparent 86%); display: inline-block; padding: 0 8px; margin-left: -8px; }

  .chart { flex: 1; position: relative; border: 3px solid var(--ink); min-height: 220px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .waiting[hidden] { display: none; }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; font-family: Caveat, cursive; font-size: 40px; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { .status.rec .dot { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="mark">
