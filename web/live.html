<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainclip live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Archivo:wght@400..800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* The live screen the room watches while someone plays. Same look as the reel page. */
  :root {
    --wine: #7b1530; --cherry: #d3262e; --pink: #f8c9d5; --pink-soft: #fde6ec; --cream: #fdf7f1;
    --gridc: #f3d6db; --lav: #c6c7f6; --peri: #4f55d6; --butter: #ffe28a; --peach: #f8a66f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--wine); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;
         background-color: var(--cream);
         background-image: linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px);
         background-size: 24px 24px; }
  .label { font-size: 15px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }

  nav { position: relative; background: var(--pink); z-index: 2; flex: none; }
  nav .in { padding: 16px 40px 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  nav::after { content: ""; position: absolute; left: 0; right: 0; bottom: -13px; height: 13px;
               background: radial-gradient(circle at 13px 0, var(--pink) 12.5px, transparent 13px) repeat-x; background-size: 26px 13px; }
  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 42px; letter-spacing: -0.03em; line-height: 1; }
  .status { display: flex; align-items: center; gap: 10px; }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--wine); opacity: .35; }
  .status.rec .dot { background: var(--cherry); opacity: 1; animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .timer { justify-self: end; font-family: Fraunces, Georgia, serif; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }

  main { flex: 1; display: flex; flex-direction: column; gap: 26px; padding: 40px 40px 34px; min-height: 0; }
  .top { display: flex; align-items: center; gap: 22px; flex: none; }
  .bdg { position: relative; width: 168px; height: 168px; display: grid; place-items: center; text-align: center; flex: none; transition: transform .2s; }
  .bdg svg { position: absolute; inset: 0; }
  .bdg .v { position: relative; display: block; font-family: Fraunces, Georgia, serif; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
  .bdg .k { position: relative; display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
  .bdg.spike { transform: rotate(-6deg) scale(1.06); }
  .intro { margin-left: 18px; max-width: 34ch; }
  .intro h1 { font-family: Fraunces, Georgia, serif; font-weight: 400; font-variation-settings: "SOFT" 100; font-size: 44px; line-height: 1.04; margin: 0 0 8px; letter-spacing: -0.015em; }
  .intro p { margin: 0; font-size: 18px; }

  .ticket { position: relative; flex: 1; background: var(--cream); border: 2px solid var(--wine); min-height: 240px; margin-top: 10px; }
  .ticket::before { content: ""; position: absolute; left: -2px; right: -2px; top: -15px; height: 30px;
                    background: radial-gradient(circle, var(--cherry) 14px, transparent 14.5px) repeat-x; background-size: 40px 30px; background-position: 6px 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .waiting[hidden] { display: none; }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; font-family: Caveat, cursive; font-size: 42px; font-weight: 700; }
  .stamp { position: fixed; left: 50%; top: 52%; padding: 14px 34px 18px; background: var(--butter); border: 3px solid var(--wine);
           font-family: Caveat, cursive; font-weight: 700; font-size: 64px; line-height: 1; pointer-events: none;
           transform: translate(-50%, -50%) rotate(-6deg) scale(.4); opacity: 0; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
  .stamp.show { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
  @media (prefers-reduced-motion: reduce) { .status.rec .dot { animation: none; } .stamp, .bdg { transition: none; } }
</style>
</head>
<body>
<nav>
  <div class="in">
    <div class="status label" id="status"><span class="dot"></span><span id="status-text">Connecting to the headset</span></div>
    <div class="wordmark">brainclip</div>
    <div class="timer" id="timer">0:00</div>
  </div>
</nav>

<main>
  <div class="top">
    <div class="bdg" id="b-hype" style="color:#fdf7f1"><svg viewBox="0 0 168 168" aria-hidden="true"><path class="sc" fill="#d3262e"/></svg><div><span class="v" id="v-hype">0.0</span><span class="k">Excitement</span></div></div>
    <div class="bdg" id="b-focus"><svg viewBox="0 0 168 168" aria-hidden="true"><path class="sc" fill="#c6c7f6"/></svg><div><span class="v" id="v-focus">0.0</span><span class="k">Focus</span></div></div>
    <div class="bdg"><svg viewBox="0 0 168 168" aria-hidden="true"><path class="sc" fill="#f8a66f"/></svg><div><span class="v" id="v-count">0</span><span class="k">Moments caught</span></div></div>
    <div class="intro">
      <h1 id="headline">Play like nobody's watching.</h1>
      <p id="sub">Your brain is. Numbers show how far you are from your own last minute.</p>
    </div>
  </div>
  <div class="ticket"><canvas id="c" aria-label="Live brain activity"></canvas><div class="waiting" id="waiting">waiting for the first reading...</div></div>
</main>
<div class="stamp" id="stamp"></div>

<script>
// Same rules as detect.py: 60 s warm-up, rolling baseline (60 s ago up to 5 s ago),
// Hype = excitement above 2.0 for 1.5 s, Locked in = focus above 1.5 for 6 s.
const BASELINE_S = 60, WINDOW_S = 90, ROLL_S = 60, GAP_S = 5;
const KINDS = {Hype: {cut: 2.0, minS: 1.5}, Locked: {cut: 1.5, minS: 6}};
const C = { cream: '#fdf7f1', grid: '#f3d6db', gridMajor: '#ebbcc5', wine: '#7b1530', cherry: '#d3262e',
            peri: '#4f55d6', butter: 'rgba(255,226,138,0.88)' };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let rows = [], zEx = [], zFo = [];
const caught = new Map();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function scallop(cx, cy, r, bumps, depth) {
  let d = '';
  for (let i = 0; i <= bumps * 8; i++) {
    const a = (i / (bumps * 8)) * Math.PI * 2;
    const rr = r + depth * Math.abs(Math.cos(a * bumps / 2)) ** 0.7;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
document.querySelectorAll('.sc').forEach(p => p.setAttribute('d', scallop(84, 84, 72, 10, 9)));

const smooth = (arr, n) => arr.map((_, i) => { const s = arr.slice(Math.max(0, i - n + 1), i + 1); return s.reduce((a, x) => a + x, 0) / s.length; });
const meanSd = v => { const mu = v.reduce((a, x) => a + x, 0) / v.length; return {mu, sd: Math.sqrt(v.reduce((a, x) => a + (x - mu) ** 2, 0) / v.length)}; };
function zAll(key) {
  const sm = smooth(rows.map(r => r[key]), 3);
  const warm = sm.filter((_, i) => rows[i].t <= BASELINE_S);
  if (warm.length < 5) return sm.map(() => 0);
  const w = meanSd(warm);
  return sm.map((x, i) => {
    const t = rows[i].t;
    if (t <= BASELINE_S) return 0;
    const win = [];
    for (let j = i - 1; j >= 0 && rows[j].t >= t - ROLL_S; j--) if (rows[j].t <= t - GAP_S) win.push(sm[j]);
    const b = win.length >= 5 ? meanSd(win) : w;
    return (x - b.mu) / Math.max(b.sd, 0.25 * w.sd, 1e-6);
  });
}
function runs(zs, {cut, minS}) {
  const out = [];
  let start = -1, best = -1;
  for (let i = 0; i <= zs.length; i++) {
    if (i < zs.length && zs[i] > cut) {
      if (start < 0) start = i;
      if (best < 0 || zs[i] > zs[best]) best = i;
    } else if (start >= 0) {
      const end = Math.min(i, zs.length) - 1;
      if (rows[end].t - rows[start].t + 0.5 >= minS) out.push({start, end, best});
      start = -1; best = -1;
    }
  }
  return out;
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const signed = z => Math.abs(z) < 0.05 ? '0.0' : (z > 0 ? '+' : '−') + Math.abs(z).toFixed(1);

function highlight(x0, x1, y0, y1, seed) {
  if (x1 - x0 < 2) return;
  const r = n => Math.abs((Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453) % 1);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = C.butter;
  ctx.beginPath();
  ctx.moveTo(x0 + 3, y0 + r(1) * 5);
  ctx.lineTo(x1 - 2, y0 + r(2) * 6);
  ctx.quadraticCurveTo(x1 + 5, (y0 + y1) / 2, x1 - 1, y1 - r(3) * 5);
  ctx.lineTo(x0 + 1, y1 - r(4) * 6);
  ctx.quadraticCurveTo(x0 - 5, (y0 + y1) / 2, x0 + 3, y0 + r(1) * 5);
  ctx.fill(); ctx.restore();
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, w, h);
  for (let x = 0, i = 0; x <= w; x += 16, i++) { ctx.strokeStyle = i % 5 ? C.grid : C.gridMajor; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); ctx.stroke(); }
  for (let y = 0, i = 0; y <= h; y += 16, i++) { ctx.strokeStyle = i % 5 ? C.grid : C.gridMajor; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); ctx.stroke(); }
  if (rows.length < 2) return false;
  const tEnd = rows[rows.length - 1].t, tStart = Math.max(0, tEnd - WINDOW_S);
  const first = Math.max(0, rows.findIndex(r => r.t >= tStart));
  const padTop = 76, padBot = 34, right = w - 104;
  const X = t => 24 + (t - tStart) / Math.max(1, Math.max(WINDOW_S * 0.25, tEnd - tStart)) * (right - 24);
  const vmax = 8, vmin = -4;
  const Y = v => padTop + (vmax - Math.max(vmin, Math.min(vmax, v))) / (vmax - vmin) * (h - padTop - padBot);
  const now = performance.now();
  let animating = false;

  if (tStart < BASELINE_S) {
    const x1 = Math.min(X(BASELINE_S), X(tEnd));
    ctx.save(); ctx.beginPath(); ctx.rect(X(tStart), padTop - 12, x1 - X(tStart), h - padTop - padBot + 12); ctx.clip();
    ctx.strokeStyle = 'rgba(123,21,48,.16)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = X(tStart) - h; x < x1; x += 11) { ctx.moveTo(x, h); ctx.lineTo(x + h, 0); }
    ctx.stroke(); ctx.restore();
    ctx.fillStyle = C.wine; ctx.globalAlpha = .7; ctx.font = '700 26px Caveat, cursive';
    ctx.fillText('warm-up', X(tStart) + 10, padTop - 26); ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = C.wine; ctx.globalAlpha = 0.45; ctx.setLineDash([8, 8]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(24, Y(2)); ctx.lineTo(right, Y(2)); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.fillStyle = C.wine; ctx.font = '700 26px Caveat, cursive';
  ctx.fillText('clip line', right + 8, Y(2) + 8);

  for (const m of caught.values()) {
    if (rows[m.end].t < tStart) continue;
    const p = reduceMotion ? 1 : Math.min(1, (now - m.born) / 700);
    if (p < 1) animating = true;
    const x0 = X(Math.max(tStart, rows[m.start].t - 2)), x1full = X(rows[m.end].t + 1);
    highlight(x0, x0 + (x1full - x0) * p, padTop - 14, h - padBot + 6, m.n);
  }

  for (const [zs, color] of [[zFo, C.peri], [zEx, C.cherry]]) {
    ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = first; i < rows.length; i++) i === first ? ctx.moveTo(X(rows[i].t), Y(zs[i])) : ctx.lineTo(X(rows[i].t), Y(zs[i]));
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(X(tEnd), Y(zs[zs.length - 1]), 9, 0, Math.PI * 2); ctx.fill();
  }

  for (const m of caught.values()) {
    if (rows[m.end].t < tStart) continue;
    const p = reduceMotion ? 1 : Math.min(1, Math.max(0, (now - m.born - 350) / 400));
    if (p < 1) animating = true;
    ctx.save(); ctx.globalAlpha = p;
    ctx.translate(X(Math.max(tStart, rows[m.start].t - 2)) + 6, padTop - 24); ctx.rotate(-0.05);
    ctx.fillStyle = m.kind === 'Hype' ? C.cherry : C.peri;
    ctx.font = '700 38px Caveat, cursive';
    ctx.fillText(m.kind === 'Hype' ? `#${m.n} hype!` : `#${m.n} locked in`, 0, 0);
    ctx.restore();
  }

  ctx.fillStyle = C.wine; ctx.font = '600 15px Archivo, system-ui';
  for (let t = Math.ceil(tStart / 15) * 15; t <= tEnd; t += 15) if (t > 0) ctx.fillText(fmt(t), X(t) - 14, h - 10);
  return animating;
}

let raf = null;
function frame() { raf = draw() ? requestAnimationFrame(frame) : null; }
function redraw() { if (!raf) frame(); }

function stamp(kind) {
  if (reduceMotion) return;
  const el = document.getElementById('stamp');
  el.textContent = kind === 'Hype' ? 'hype! clipped' : 'locked in! clipped';
  el.style.color = kind === 'Hype' ? C.cherry : C.peri;
  el.classList.add('show');
  clearTimeout(stamp.t); stamp.t = setTimeout(() => el.classList.remove('show'), 1600);
}

async function poll() {
  try {
    const res = await fetch('brain.jsonl', {cache: 'no-store'});
    rows = (await res.text()).split('\n').filter(Boolean).map(l => JSON.parse(l));
  } catch (e) { return; }
  const last = rows[rows.length - 1];
  document.getElementById('waiting').hidden = !!last;
  if (!last) return;
  zEx = zAll('excitement'); zFo = zAll('focus');
  document.getElementById('timer').textContent = fmt(last.t);
  const st = document.getElementById('status'), stt = document.getElementById('status-text');
  if (last.t < BASELINE_S) {
    st.className = 'status label';
    stt.textContent = `Warm-up, ${Math.ceil(BASELINE_S - last.t)} s left`;
    document.getElementById('headline').textContent = 'Warming up.';
    document.getElementById('sub').textContent = 'Play casually for a minute so Brainclip learns what normal looks like for you.';
  } else {
    st.className = 'status label rec'; stt.textContent = 'Recording';
    document.getElementById('headline').textContent = "Play like nobody's watching.";
    document.getElementById('sub').textContent = 'Your brain is. Numbers show how far you are from your own last minute.';
    const zh = zEx[zEx.length - 1], zf = zFo[zFo.length - 1];
    document.getElementById('v-hype').textContent = signed(zh);
    document.getElementById('v-focus').textContent = signed(zf);
    document.getElementById('b-hype').classList.toggle('spike', zh > KINDS.Hype.cut);
    document.getElementById('b-focus').classList.toggle('spike', zf > KINDS.Locked.cut);
  }
  for (const [kind, zs] of [['Hype', zEx], ['Locked', zFo]]) {
    for (const r of runs(zs, KINDS[kind])) {
      const key = kind + rows[r.start].t;
      if (caught.has(key)) { Object.assign(caught.get(key), {end: r.end, best: r.best}); continue; }
      caught.set(key, {kind, ...r, born: performance.now(), n: caught.size + 1});
      stamp(kind);
    }
  }
  document.getElementById('v-count').textContent = caught.size;
  redraw();
}
setInterval(poll, 500);
window.addEventListener('resize', redraw);
document.fonts.ready.then(redraw);
poll();
</script>
</body>
</html>
